<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KaziNexus | Apply</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#172033}.head{padding:16px 6%;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}.logo{font-size:26px;font-weight:800;color:#126b48}.logo span{color:#f2a900}.head a{color:#126b48;text-decoration:none;font-weight:700}.wrap{max-width:780px;margin:30px auto;padding:20px}.card{background:#fff;padding:25px;border-radius:14px;box-shadow:0 4px 18px #0001}.field{margin:15px 0}label{display:block;font-weight:bold;margin-bottom:6px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3dc;border-radius:8px}textarea{min-height:140px}button{padding:13px 20px;background:#126b48;color:#fff;border:0;border-radius:8px;font-weight:bold}.msg{display:none;margin-top:15px;padding:12px;border-radius:8px}.ok{display:block;background:#e9f7ef;color:#126b48}.err{display:block;background:#fff0f0;color:#a12b2b}.muted{color:#667085}.jobbox{background:#f8fafb;padding:18px;border-radius:10px;margin-bottom:18px}</style></head><body><header class="head"><div class="logo">Kazi<span>Nexus</span></div><a href="/jobs/">Find Jobs</a></header><main class="wrap"><div class="card"><div id="job">Loading job...</div><hr><h2>Apply for this job</h2><form id="form"><div class="field"><label>Full Name *</label><input id="name" required></div><div class="field"><label>Email *</label><input id="email" type="email" required></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>CV Link</label><input id="cv_url" type="url" placeholder="https://...your CV link"></div><div class="field"><label>Cover Letter</label><textarea id="cover" placeholder="Tell the employer why you are a good fit."></textarea></div><button id="submit">Submit Application</button></form><div id="msg" class="msg"></div></div></main><script>const URL='https://vljehlfeglstpgphzebj.supabase.co',KEY='sb_publishable_QtYMFyv1din55Ch8bbznug_YCoF1XB3',db=supabase.createClient(URL,KEY),params=new URLSearchParams(location.search),jobId=params.get('job')||params.get('id');let job,session;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function show(t,c){$('msg').textContent=t;$('msg').className='msg '+c}async function init(){const s=await db.auth.getSession();session=s.data.session;if(!session){location.href='/jobseekers/auth.html';return}if(!jobId){$('job').innerHTML='<h1>No job selected</h1><p class="muted">Open Apply from a KaziNexus job listing.</p>';$('form').style.display='none';return}const r=await db.from('jobs').select('*').eq('id',jobId).eq('status','active').maybeSingle();if(r.error||!r.data){$('job').innerHTML='<h1>Job not found</h1><p class="muted">This vacancy may have closed or no longer exists.</p>';$('form').style.display='none';return}job=r.data;$('job').innerHTML=`<div class="jobbox"><h1>${esc(job.title)}</h1><p><b>${esc(job.company)}</b> • ${esc(job.location)} • ${esc(job.job_type)}</p><p>${esc(job.description).replace(/\n/g,'<br>')}</p><p><b>Responsibilities</b><br>${esc(job.responsibilities||'Not specified').replace(/\n/g,'<br>')}</p><p><b>Qualifications</b><br>${esc(job.qualifications||'Not specified').replace(/\n/g,'<br>')}</p><p><b>Deadline:</b> ${esc(job.deadline)}</p></div>`;const p=await db.from('job_seekers').select('*').eq('id',session.user.id).maybeSingle();if(p.data){$('name').value=p.data.full_name||'';$('email').value=session.user.email||'';$('phone').value=p.data.phone||'';$('cv_url').value=p.data.cv_url||''}}$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;const r=await db.from('applications').insert({job_id:job.id,job_seeker_id:session.user.id,applicant_name:$('name').value.trim(),applicant_email:$('email').value.trim(),applicant_phone:$('phone').value.trim()||null,cover_letter:$('cover').value.trim()||null,cv_url:$('cv_url').value.trim()||null});if(r.error){show(r.error.code==='23505'?'You have already applied for this job.':r.error.message,'err')}else{show('Application submitted successfully.','ok');setTimeout(()=>location.href='/jobseekers/dashboard.html',900)}$('submit').disabled=false};init();</script></body></html>
