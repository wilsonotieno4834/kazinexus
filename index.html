<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KaziNexus | Find Jobs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.header{background:#fff;border-bottom:1px solid #ddd;padding:16px 6%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:800;color:#126b48}.logo span{color:#f2a900}.header a{color:#126b48;text-decoration:none;font-weight:700}.container{max-width:1050px;margin:35px auto;padding:0 20px}.search{background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 16px #00000010;display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px}input,select{padding:13px;border:1px solid #d5dbe3;border-radius:8px;font-size:15px;box-sizing:border-box;width:100%}button{background:#126b48;color:#fff;border:0;border-radius:8px;padding:13px 20px;font-weight:800;cursor:pointer}.heading{margin:30px 0 15px}.job{background:#fff;border-radius:12px;padding:22px;margin-bottom:15px;box-shadow:0 3px 12px #0000000b}.job h2{margin:5px 0 8px;color:#0b4f6c}.meta{color:#667085;font-size:14px}.tag{display:inline-block;background:#eef8f3;color:#126b48;padding:5px 9px;border-radius:14px;font-size:12px;font-weight:700;margin-top:10px}.apply{display:inline-block;margin-top:15px;background:#126b48;color:#fff;text-decoration:none;padding:10px 15px;border-radius:7px;font-weight:700}.empty,.loading{background:#fff;padding:30px;border-radius:12px;text-align:center;color:#667085}.error{background:#fff0f0;color:#a12b2b;padding:15px;border-radius:9px;margin-top:15px}@media(max-width:750px){.search{grid-template-columns:1fr}.container{padding:0 14px}.header{padding:14px}.logo{font-size:23px}}
</style></head><body>
<header class="header"><div class="logo">Kazi<span>Nexus</span></div><a href="/">Home</a></header>
<div class="container"><h1>Find Jobs</h1><p class="meta">Discover current opportunities posted on KaziNexus.</p>
<div class="search"><input id="keyword" placeholder="Job title, skill or company"><input id="location" placeholder="Location"><select id="type"><option value="">All job types</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option><option>Volunteer</option><option>Remote</option></select><button onclick="loadJobs()">Search</button></div>
<div id="status"></div><div class="heading"><h2>Latest Opportunities</h2></div><div id="jobs" class="loading">Loading jobs...</div></div>
<script>
const SUPABASE_URL='https://vljehlfeglstpgphzebj.supabase.co';
const SUPABASE_KEY='sb_publishable_QtYMFyv1din55Ch8bbznug_YCoF1XB3';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadJobs(){
 const box=document.getElementById('jobs'); box.className='loading'; box.textContent='Loading jobs...'; document.getElementById('status').innerHTML='';
 const keyword=document.getElementById('keyword').value.trim(); const location=document.getElementById('location').value.trim(); const type=document.getElementById('type').value;
 let q=db.from('jobs').select('id,title,company,location,job_type,salary,description,deadline,application_email,application_link,contact_person,created_at,status').eq('status','active').gte('deadline',new Date().toISOString().slice(0,10)).order('created_at',{ascending:false});
 if(keyword) q=q.or(`title.ilike.%${keyword}%,company.ilike.%${keyword}%,description.ilike.%${keyword}%`);
 if(location) q=q.ilike('location',`%${location}%`); if(type) q=q.eq('job_type',type);
 const {data,error}=await q;
 if(error){box.className='error';box.textContent='Unable to load jobs: '+error.message;return}
 if(!data.length){box.className='empty';box.textContent='No matching active jobs found.';return}
 box.className=''; box.innerHTML=data.map(j=>{let apply='';apply=`<a class="apply" href="/apply/?id=${encodeURIComponent(j.id)}">Apply Now</a>`;return `<article class="job"><div class="meta">${esc(j.location)} • ${esc(j.job_type)}${j.salary?' • '+esc(j.salary):''}</div><h2>${esc(j.title)}</h2><strong>${esc(j.company)}</strong><p>${esc(j.description)}</p><span class="tag">Deadline: ${esc(j.deadline)}</span><br><a class="apply" href="/jobs/detail.html?id=${encodeURIComponent(j.id)}">View Job</a> <a class="apply" style="background:#25d366" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(j.title+' - KaziNexus\n'+location.origin+'/jobs/detail.html?id='+j.id)}">WhatsApp</a></article>`}).join('');
}
loadJobs();
</script></body></html>
