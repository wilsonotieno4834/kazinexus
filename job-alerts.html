<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Alerts | KaziNexus</title><meta name="description" content="Create and manage job alerts on KaziNexus."><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;padding:20px}.card{max-width:700px;margin:25px auto;background:#fff;padding:24px;border-radius:14px}input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ccd5df;border-radius:8px}button{background:#0b6e4f;color:#fff;border:0}.alert{border:1px solid #dde3ea;padding:12px;margin:10px 0;border-radius:9px}</style></head><body><div class="card"><h1>Job Alerts</h1><p>Save what you are looking for. Alert delivery can be connected to an email provider in the next production integration.</p><form id="f"><input id="keyword" placeholder="Keyword e.g. Sales Representative"><input id="county" placeholder="County e.g. Kisumu"><select id="type"><option value="">Any job type</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option><option>Remote</option></select><button>Create Alert</button></form><p id="msg"></p><h2>Your alerts</h2><div id="list">Loading…</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://vljehlfeglstpgphzebj.supabase.co','sb_publishable_QtYMFyv1din55Ch8bbznug_YCoF1XB3');async function getUser(){const {data}=await db.auth.getUser();return data.user}async function load(){const u=await getUser();if(!u){list.textContent='Please sign in to manage alerts.';return}const {data,error}=await db.from('job_alerts').select('*').eq('user_id',u.id).order('created_at',{ascending:false});list.innerHTML=error?error.message:(data||[]).map(a=>`<div class="alert"><strong>${a.keyword||'Any keyword'}</strong><br>${a.county||'Any county'} · ${a.job_type||'Any type'}<br><button onclick="removeAlert('${a.id}')">Delete</button></div>`).join('')||'No alerts yet.'}f.onsubmit=async e=>{e.preventDefault();const u=await getUser();if(!u){msg.textContent='Please sign in first.';return}const {error}=await db.from('job_alerts').insert({user_id:u.id,keyword:keyword.value.trim()||null,county:county.value.trim()||null,job_type:type.value||null});msg.textContent=error?error.message:'Alert created.';if(!error)e.target.reset();load()};async function removeAlert(id){await db.from('job_alerts').delete().eq('id',id);load()}load();</script></body></html>
