<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KaziNexus | Job Alerts</title><style>body{font-family:Arial;margin:0;background:#f6f8fb;color:#172033}header{background:#126b48;color:#fff;padding:22px;text-align:center}main{max-width:700px;margin:auto;padding:24px}.card{background:#fff;padding:25px;border-radius:14px;box-shadow:0 3px 15px #0001}input,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #ccd4df;border-radius:8px}button{background:#126b48;color:#fff;border:0;padding:13px 20px;border-radius:8px;font-weight:700}</style></head><body><header><h1>Job Alerts</h1><p>Get notified about opportunities matching your interests.</p></header><main><div class="card"><form id="f"><input id="email" type="email" required placeholder="Email address"><input id="keyword" placeholder="Keyword, e.g. Project Assistant"><input id="location" placeholder="Location, e.g. Nairobi or Kisumu"><select id="type"><option value="">Any job type</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option><option>Volunteer</option><option>Remote</option></select><button>Create Job Alert</button></form><p id="m"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://vljehlfeglstpgphzebj.supabase.co','sb_publishable_QtYMFyv1din55Ch8bbznug_YCoF1XB3');f.onsubmit=async e=>{e.preventDefault();let{error}=await db.from('job_alerts').insert({email:email.value.trim(),keyword:keyword.value.trim()||null,location:location.value.trim()||null,job_type:type.value||null});m.textContent=error?error.message:'Job alert created successfully.';if(!error)f.reset()};</script></body></html>
