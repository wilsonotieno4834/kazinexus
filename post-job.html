<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KaziNexus | Post a Job</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.header{background:#fff;border-bottom:1px solid #ddd;padding:16px 6%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:800;color:#126b48}.logo span{color:#f2a900}.header a{color:#126b48;text-decoration:none;font-weight:700}.container{max-width:850px;margin:45px auto;padding:0 20px}.card{background:#fff;padding:32px;border-radius:14px;box-shadow:0 5px 20px #00000010}h1{margin-top:0}.intro{color:#667085;margin-bottom:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin-bottom:18px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:7px}input,select,textarea{width:100%;padding:13px;border:1px solid #d5dbe3;border-radius:8px;font-size:15px;box-sizing:border-box}textarea{min-height:120px;resize:vertical}button{background:#126b48;color:white;border:0;padding:14px 24px;border-radius:8px;font-weight:800;font-size:16px;cursor:pointer}.note{background:#eef8f3;padding:13px;border-radius:8px;color:#126b48;margin-bottom:25px}.msg{display:none;margin-top:20px;padding:15px;border-radius:9px;line-height:1.5}.success{background:#e9f7ef;color:#126b48}.error{background:#fff0f0;color:#a12b2b}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><header class="header"><div class="logo">Kazi<span>Nexus</span></div><a href="/employers/dashboard.html">Dashboard</a></header>
<div class="container"><div class="card"><h1>Post a Job</h1><p class="intro">Connect your vacancy with candidates who have the right skills.</p><div class="note"><strong>Basic job posting is free</strong> for employers on KaziNexus.</div>
<form id="jobForm"><div class="grid"><div class="field"><label>Job Title *</label><input id="title" required></div><div class="field"><label>Company / Organization *</label><input id="company" required></div><div class="field"><label>Location *</label><input id="location" required placeholder="e.g. Kisumu, Nairobi, Remote"></div><div class="field"><label>Job Type *</label><select id="type" required><option value="">Select type</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option><option>Volunteer</option><option>Remote</option></select></div><div class="field"><label>Salary / Compensation</label><input id="salary"></div><div class="field"><label>Application Deadline *</label><input id="deadline" type="date" required></div><div class="field full"><label>Job Description *</label><textarea id="description" required></textarea></div><div class="field full"><label>Key Responsibilities</label><textarea id="responsibilities"></textarea></div><div class="field full"><label>Qualifications & Requirements</label><textarea id="qualifications"></textarea></div><div class="field"><label>Application Email</label><input id="application_email" type="email"></div><div class="field"><label>Application Link</label><input id="application_link" type="url" placeholder="https://..."></div><div class="field"><label>Contact Person</label><input id="contact"></div></div><button id="submitBtn" type="submit">Publish Job</button></form><div id="msg" class="msg"></div></div></div>
<script>
const SUPABASE_URL='https://vljehlfeglstpgphzebj.supabase.co';
const SUPABASE_KEY='sb_publishable_QtYMFyv1din55Ch8bbznug_YCoF1XB3';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById('jobForm'); const msg=document.getElementById('msg'); const btn=document.getElementById('submitBtn');
function message(t,c){msg.textContent=t;msg.className='msg '+c;msg.style.display='block'}
(async()=>{const {data:{session}}=await db.auth.getSession(); if(!session){message('Please log in as an employer before posting a job.','error');btn.disabled=true;}})();
form.addEventListener('submit',async e=>{e.preventDefault();msg.style.display='none';btn.disabled=true;btn.textContent='Publishing...';
 try{const {data:{session}}=await db.auth.getSession();if(!session)throw new Error('Please log in as an employer first.');
 const company=document.getElementById('company').value.trim();
 const {data,error}=await db.from('jobs').insert({employer_id:session.user.id,title:document.getElementById('title').value.trim(),company,location:document.getElementById('location').value.trim(),job_type:document.getElementById('type').value,salary:document.getElementById('salary').value.trim()||null,description:document.getElementById('description').value.trim(),responsibilities:document.getElementById('responsibilities').value.trim()||null,qualifications:document.getElementById('qualifications').value.trim()||null,application_email:document.getElementById('application_email').value.trim()||null,application_link:document.getElementById('application_link').value.trim()||null,contact_person:document.getElementById('contact').value.trim()||null,deadline:document.getElementById('deadline').value,status:'pending'}).select().single();
 if(error)throw error; message('Job submitted successfully. It is now pending admin review before appearing publicly.','success'); form.reset(); setTimeout(()=>location.href='/employers/dashboard.html',1200);
 }catch(err){message(err.message||'Unable to publish job.','error');btn.disabled=false;btn.textContent='Publish Job';}
});
</script></body></html>
