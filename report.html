<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report a Job or Employer | KaziNexus</title><meta name="description" content="Report a vacancy or employer on KaziNexus for review by the KaziNexus administration team."><style>body{font-family:Arial,sans-serif;background:#f6f8fb;margin:0;padding:20px}.card{max-width:650px;margin:30px auto;background:white;padding:25px;border-radius:14px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ccd5df;border-radius:8px}button{background:#102a43;color:#fff;border:0}</style></head><body><div class="card"><h1>Report a Job or Employer</h1><p>Use this form to report suspicious, misleading, or inappropriate content.</p><form id="f"><select id="kind"><option value="job">Job</option><option value="employer">Employer</option></select><input id="target" placeholder="Job ID or Employer ID" required><select id="reason"><option>Suspicious or fraudulent vacancy</option><option>Misleading information</option><option>Inappropriate content</option><option>Employer impersonation</option><option>Other</option></select><textarea id="details" rows="6" placeholder="Tell us what happened"></textarea><button>Submit report</button></form><p id="msg"></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://vljehlfeglstpgphzebj.supabase.co','sb_publishable_QtYMFyv1din55Ch8bbznug_YCoF1XB3');document.getElementById('f').onsubmit=async e=>{e.preventDefault();const {data:{user}}=await db.auth.getUser();if(!user){msg.textContent='Please sign in before submitting a report.';return}const kind=document.getElementById('kind').value,target=document.getElementById('target').value.trim();const row={reporter_id:user.id,reason:reason.value,details:details.value};if(kind==='job')row.job_id=target;else row.employer_id=target;const {error}=await db.from('reports').insert(row);msg.textContent=error?error.message:'Report submitted successfully.';if(!error)e.target.reset()};</script></body></html>
