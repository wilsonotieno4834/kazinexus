<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KaziNexus | Job Seeker Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#172033}.head{padding:16px 6%;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:26px;font-weight:800;color:#126b48}.logo span{color:#f2a900}.head a{color:#126b48;text-decoration:none;font-weight:700;margin-right:12px}.head button,.btn{padding:10px 15px;border:0;border-radius:8px;background:#126b48;color:#fff;font-weight:bold}.wrap{max-width:950px;margin:30px auto;padding:20px}.card{background:#fff;padding:24px;border-radius:14px;margin-bottom:20px;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin-bottom:15px}label{font-weight:bold;display:block;margin-bottom:6px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3dc;border-radius:8px}textarea{min-height:90px}.muted{color:#667085}.msg{margin-top:12px;padding:10px;border-radius:8px;display:none}.ok{background:#e9f7ef;color:#126b48}.err{background:#fff0f0;color:#a12b2b}.application{border-top:1px solid #eee;padding:16px 0}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2f6;font-size:13px;font-weight:bold}.empty{padding:18px 0}.cv{color:#126b48;font-weight:bold}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{align-items:flex-start}.head a{display:inline-block;margin-top:8px}}
</style></head><body><header class="head"><div class="logo">Kazi<span>Nexus</span></div><div><a href="/jobs/">Find Jobs</a><button onclick="logout()">Log Out</button></div></header><main class="wrap"><div class="card"><h1>Job Seeker Dashboard</h1><p class="muted" id="account"></p></div><div class="card"><h2>My Profile</h2><form id="profile"><div class="grid"><div class="field"><label>Full Name *</label><input id="name" required></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Location</label><input id="location"></div><div class="field"><label>Professional Headline</label><input id="headline"></div><div class="field"><label>Skills</label><textarea id="skills"></textarea></div><div class="field"><label>Short Bio</label><textarea id="bio"></textarea></div><div class="field"><label>CV Link</label><input id="cv_url" type="url" placeholder="https://..."></div></div><button class="btn">Save Profile</button></form><div id="msg" class="msg"></div></div><div class="card"><h2>My Applications</h2><div id="apps" class="muted">Loading...</div></div></main><script>const URL='https://vljehlfeglstpgphzebj.supabase.co',KEY='sb_publishable_QtYMFyv1din55Ch8bbznug_YCoF1XB3',db=supabase.createClient(URL,KEY);let uid,session;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function init(){const r=await db.auth.getSession();session=r.data.session;if(!session){location.href='/jobseekers/auth.html';return}uid=session.user.id;$('account').textContent='Signed in as '+session.user.email;const q=await db.from('job_seekers').select('*').eq('id',uid).maybeSingle();if(q.error){show(q.error.message,'err');return}if(q.data){$('name').value=q.data.full_name||'';$('phone').value=q.data.phone||'';$('location').value=q.data.location||'';$('headline').value=q.data.headline||'';$('skills').value=q.data.skills||'';$('bio').value=q.data.bio||'';$('cv_url').value=q.data.cv_url||''}await loadApps()}async function loadApps(){const r=await db.from('applications').select('id,status,created_at,applicant_email,cover_letter,jobs(title,company,location,deadline)').eq('job_seeker_id',uid).order('created_at',{ascending:false});const e=$('apps');if(r.error){e.textContent=r.error.message;return}if(!r.data?.length){e.innerHTML='<div class="empty">No applications yet. <a href="/jobs/">Find a job</a>.</div>';return}e.innerHTML=r.data.map(a=>`<div class="application"><h3>${esc(a.jobs?.title||'Job')}</h3><div>${esc(a.jobs?.company||'')} • ${esc(a.jobs?.location||'')}</div><div>Applied: ${esc(new Date(a.created_at).toLocaleDateString())}</div><p>Status: <span class="status">${esc(a.status)}</span></p></div>`).join('')}function show(t,c){$('msg').textContent=t;$('msg').className='msg '+c;$('msg').style.display='block'}$('profile').onsubmit=async e=>{e.preventDefault();const r=await db.from('job_seekers').upsert({id:uid,full_name:$('name').value.trim(),phone:$('phone').value.trim()||null,location:$('location').value.trim()||null,headline:$('headline').value.trim()||null,skills:$('skills').value.trim()||null,bio:$('bio').value.trim()||null,cv_url:$('cv_url').value.trim()||null});show(r.error?r.error.message:'Profile saved successfully.',r.error?'err':'ok');if(!r.error)setTimeout(()=>location.reload(),700)};async function logout(){await db.auth.signOut();location.href='/jobseekers/auth.html'}init();</script></body></html>
