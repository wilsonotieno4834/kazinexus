<style>
*{

}

body{

  background:#f6f8fb;
  color:#172033;
}

header{
  background:#0b5ed7;
  color:#fff;
  padding:16px 20px;
}

.nav{
  max-width:1150px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  color:#fff;
  text-decoration:none;
  font-size:24px;
  font-weight:800;
}

.navlinks{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

.navlinks a{
  color:#fff;
  text-decoration:none;
  font-weight:600;
}

.hero{
  background:#fff;
  padding:35px 20px 25px;
  border-bottom:1px solid #e5e7eb;
}

.hero-inner{
  max-width:1150px;
  margin:auto;
}

h1{
  margin:0 0 8px;
  font-size:34px;
}

.hero p{
  margin:0;
  color:#667085;
}

.container{
  max-width:1150px;
  margin:25px auto;
  padding:0 20px;
}

.filters{
  background:#fff;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:25px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:6px;
  font-size:14px;
}

select{
  width:100%;
  padding:11px 12px;
  border:1px solid #d0d5dd;
  border-radius:8px;
  background:#fff;
  font-size:15px;
}

.status{
  margin-bottom:18px;
  font-weight:600;
}

.jobs{
  display:grid;
  gap:16px;
}

.job{
  background:#fff;
  border-radius:12px;
  padding:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  border:1px solid #eaecf0;
}

.job h2{
  margin:0 0 8px;
  font-size:21px;
}

.job h2 a{
  color:#0b5ed7;
  text-decoration:none;
}

.company{
  font-weight:700;
  margin-bottom:8px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:10px 0;
}

.badge{
  background:#eef4ff;
  color:#0b5ed7;
  border-radius:20px;
  padding:5px 10px;
  font-size:13px;
  font-weight:600;
}

.description{
  color:#475467;
  line-height:1.55;
  margin-top:10px;
}

.view{
  display:inline-block;
  margin-top:12px;
  padding:10px 16px;
  background:#0b5ed7;
  color:#fff;
  text-decoration:none;
  border-radius:8px;
  font-weight:700;
}

.empty,
.error{
  background:#fff;
  padding:25px;
  border-radius:12px;
  text-align:center;
  border:1px solid #eaecf0;
}

.error{
  color:#b42318;
}

footer{
  margin-top:50px;
  background:#101828;
  color:#fff;
  padding:30px 20px;
}

.footer-inner{
  max-width:1150px;
  margin:auto;
}

footer a{
  color:#fff;
}

@media(max-width:700px){
  .nav{
    align-items:flex-start;
    flex-direction:column;
  }

  .filters{
    grid-template-columns:1fr;
  }

  h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  'https://vljehlfeglstpgphzebd.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_QtYMFyv1din55Ch8bbznug_YCoF1XB3';

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const jobsContainer = document.getElementById('jobs');
const statusEl = document.getElementById('status');

const countyEl = document.getElementById('county');
const categoryEl = document.getElementById('category');
const jobtypeEl = document.getElementById('jobtype');


function escapeHtml(value) {
  if (value === null || value === undefined) return '';

  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


function formatDate(value) {
  if (!value) return '';

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleDateString('en-KE', {
    year: 'numeric',
    month: 'short',
    day: 'numeric'
  });
}


function showError(error) {
  console.error('KaziNexus Supabase error:', error);

  statusEl.textContent = 'Unable to load jobs.';
  
  jobsContainer.innerHTML = `
    <div class="error">
      <h2>Unable to load jobs</h2>
      <p>Please refresh the page and try again.</p>
    </div>
  `;
}


async function loadCategories() {

  const { data, error } = await sb
    .from('categories')
    .select('id,name')
    .order('name', { ascending:true });

  if (error) {
    console.warn('Categories could not be loaded:', error);
    return;
  }

  categoryEl.innerHTML =
    '<option value="">All categories</option>';

  (data || []).forEach(category => {

    const option = document.createElement('option');

    option.value = category.id;
    option.textContent = category.name;

    categoryEl.appendChild(option);
  });
}


async function loadJobs() {

  statusEl.textContent = 'Loading jobs...';
  jobsContainer.innerHTML = '';

  let query = sb
    .from('public_active_jobs')
    .select('*')
    .order('created_at', { ascending:false });

  const county = countyEl.value.trim();
  const category = categoryEl.value;
  const jobtype = jobtypeEl.value.trim();

  if (county) {
    query = query.ilike('location', `%${county}%`);
  }

  if (category) {
    query = query.eq('category_id', category);
  }

  if (jobtype) {
    query = query.eq('job_type', jobtype);
  }

  const { data, error } = await query;

  if (error) {
    showError(error);
    return;
  }

  if (!data || data.length === 0) {

    statusEl.textContent = 'No jobs found.';

    jobsContainer.innerHTML = `
      <div class="empty">
        <h2>No jobs found</h2>
        <p>Try changing your filters or check again later.</p>
      </div>
    `;

    return;
  }

  statusEl.textContent =
    `${data.length} job${data.length === 1 ? '' : 's'} found`;

  jobsContainer.innerHTML = data.map(job => {

    const verified = job.employer_verified
      ? '<span class="badge">Verified Employer</span>'
      : '';

    const category =
      job.category_name
      ? `<span class="badge">${escapeHtml(job.category_name)}</span>`
      : '';

    const type =
      job.job_type
      ? `<span class="badge">${escapeHtml(job.job_type)}</span>`
      : '';

    const location =
      job.location
      ? `<span class="badge">${escapeHtml(job.location)}</span>`
      : '';

    const salary =
      job.salary
      ? `<span class="badge">${escapeHtml(job.salary)}</span>`
      : '';

    const deadline =
      job.deadline
      ? `<span class="badge">Deadline: ${escapeHtml(formatDate(job.deadline))}</span>`
      : '';

    const description =
      job.description
      ? escapeHtml(
          String(job.description).length > 220
            ? String(job.description).substring(0,220) + '...'
            : job.description
        )
      : 'View this opportunity for more information.';

    return `
      <article class="job">

        <h2>
          <a href="/jobs/detail.html?id=${encodeURIComponent(job.id)}">
            ${escapeHtml(job.title || 'Job Opportunity')}
          </a>
        </h2>

        <div class="company">
          ${escapeHtml(job.company || 'Employer')}
        </div>

        <div class="meta">
          ${verified}
          ${category}
          ${type}
          ${location}
          ${salary}
          ${deadline}
        </div>

        <div class="description">
          ${description}
        </div>

        <a
          class="view"
          href="/jobs/detail.html?id=${encodeURIComponent(job.id)}"
        >
          View Job
        </a>

      </article>
    `;

  }).join('');
}


countyEl.addEventListener('change', loadJobs);
categoryEl.addEventListener('change', loadJobs);
jobtypeEl.addEventListener('change', loadJobs);


(async function init() {

  await loadCategories();

  await loadJobs();

})();
</script>

</body>
</html>
