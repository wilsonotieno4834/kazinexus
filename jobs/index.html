<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Find Jobs in Kenya | KaziNexus</title>

<meta name="description"
content="Find verified job opportunities across Kenya on KaziNexus. Search jobs by keyword, county, category and job type.">

<meta name="robots" content="index, follow">

<link rel="canonical" href="https://kazinexus.pages.dev/jobs/">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#0b5d3b;
  color:#fff;
  padding:18px 20px;
}

header .wrap{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

header a{
  color:#fff;
  text-decoration:none;
  font-weight:700;
}

.brand{
  font-size:22px;
  font-weight:900;
}

.wrap{
  max-width:1100px;
  margin:auto;
}

.hero{
  padding:30px 20px 20px;
}

.hero h1{
  margin:0 0 8px;
  font-size:32px;
}

.hero p{
  margin:0;
  color:#5d6675;
  line-height:1.5;
}

.filters{
  background:#fff;
  padding:18px;
  margin:0 20px 22px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);

  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:10px;
}

.filters input,
.filters select,
.filters button{
  width:100%;
  padding:12px;
  border:1px solid #d8dee8;
  border-radius:8px;
  font-size:15px;
}

.filters input:focus,
.filters select:focus{
  outline:2px solid #bfe5d2;
  border-color:#0b5d3b;
}

.filters button{
  background:#0b5d3b;
  color:#fff;
  border:0;
  font-weight:700;
  cursor:pointer;
}

.filters button:hover{
  background:#084a30;
}

.status{
  margin:0 20px 15px;
  color:#596273;
  font-weight:600;
}

.jobs{
  padding:0 20px 40px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  border:1px solid #edf0f4;
}

.card h2{
  margin:0 0 7px;
  font-size:20px;
  color:#172033;
}

.company{
  font-weight:700;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:10px 0;
}

.pill{
  background:#eef3f0;
  border-radius:20px;
  padding:6px 10px;
  font-size:13px;
  display:inline-block;
}

.verified{
  background:#e7f5ed;
  color:#0b5d3b;
  font-weight:700;
}

.excerpt{
  color:#596273;
  line-height:1.5;
  margin-bottom:0;
}

.actions{
  margin-top:15px;
}

.actions a{
  display:inline-block;
  background:#0b5d3b;
  color:#fff;
  text-decoration:none;
  padding:10px 15px;
  border-radius:7px;
  font-weight:700;
}

.actions a:hover{
  background:#084a30;
}

.empty,
.error{
  background:#fff;
  padding:25px;
  border-radius:12px;
  text-align:center;
  border:1px solid #edf0f4;
}

.error{
  color:#a33;
}

.loading{
  background:#fff;
  padding:25px;
  border-radius:12px;
  text-align:center;
}

@media(max-width:800px){

  .filters{
    grid-template-columns:1fr 1fr;
  }

  .filters input,
  .filters button{
    grid-column:1/-1;
  }
}

@media(max-width:520px){

  .filters{
    grid-template-columns:1fr;
  }

  .filters input,
  .filters button{
    grid-column:auto;
  }

  .hero h1{
    font-size:27px;
  }

  .card{
    padding:17px;
  }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>

  <div class="wrap">

    <a class="brand" href="/">
      KaziNexus
    </a>

    <a href="/">
      Home
    </a>

  </div>

</header>


<main class="wrap">

<section class="hero">

  <h1>
    Find Jobs in Kenya
  </h1>

  <p>
    Search current opportunities by keyword, county, category or job type.
  </p>

</section>


<section class="filters">

  <input
    id="q"
    type="search"
    placeholder="Search jobs, company or location"
    autocomplete="off"
  >

  <select id="county">
    <option value="">All counties</option>
  </select>

  <select id="category">
    <option value="">All categories</option>
  </select>

  <select id="type">

    <option value="">
      All job types
    </option>

    <option value="Full-time">
      Full-time
    </option>

    <option value="Part-time">
      Part-time
    </option>

    <option value="Contract">
      Contract
    </option>

    <option value="Temporary">
      Temporary
    </option>

    <option value="Internship">
      Internship
    </option>

    <option value="Volunteer">
      Volunteer
    </option>

    <option value="Remote">
      Remote
    </option>

  </select>

  <button id="searchBtn">
    Search
  </button>

</section>


<div id="status" class="status">
  Loading jobs...
</div>


<section id="jobs" class="jobs"></section>

</main>


<script>

const SUPABASE_URL =
  'https://vljehlfeglstpgphzebd.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_JXl3v8y4m8bq6p2z9n7k5r3t1s0f';

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   KENYA COUNTIES
========================= */

const counties = [

  'Baringo',
  'Bomet',
  'Bungoma',
  'Busia',
  'Elgeyo-Marakwet',
  'Embu',
  'Garissa',
  'Homa Bay',
  'Isiolo',
  'Kajiado',
  'Kakamega',
  'Kericho',
  'Kiambu',
  'Kilifi',
  'Kirinyaga',
  'Kisii',
  'Kisumu',
  'Kitui',
  'Kwale',
  'Laikipia',
  'Lamu',
  'Machakos',
  'Makueni',
  'Mandera',
  'Marsabit',
  'Meru',
  'Migori',
  'Mombasa',
  'Murang’a',
  'Nairobi',
  'Nakuru',
  'Nandi',
  'Narok',
  'Nyamira',
  'Nyandarua',
  'Nyeri',
  'Samburu',
  'Siaya',
  'Taita-Taveta',
  'Tana River',
  'Tharaka-Nithi',
  'Trans Nzoia',
  'Turkana',
  'Uasin Gishu',
  'Vihiga',
  'Wajir',
  'West Pokot'

];


counties.forEach(county => {

  const option =
    document.createElement('option');

  option.value = county;

  option.textContent = county;

  document
    .getElementById('county')
    .appendChild(option);

});


/* =========================
   HTML ESCAPE
========================= */

function esc(value){

  return String(value ?? '')
    .replace(
      /[&<>"']/g,
      character => ({

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'

      }[character])
    );

}


/* =========================
   VALUE HELPER
========================= */

function val(object,...keys){

  for(const key of keys){

    if(
      object?.[key] !== undefined &&
      object?.[key] !== null &&
      String(object[key]).trim() !== ''
    ){

      return object[key];

    }

  }

  return '';

}


/* =========================
   TEXT EXCERPT
========================= */

function excerpt(value){

  let text =
    String(value || '')
      .replace(/<[^>]*>/g,' ')
      .replace(/\s+/g,' ')
      .trim();

  if(text.length > 190){

    return text.slice(0,187) + '...';

  }

  return text;

}


/* =========================
   LOAD CATEGORIES
========================= */

async function loadCategories(){

  const categorySelect =
    document.getElementById('category');

  const {
    data,
    error
  } =
    await sb
      .from('categories')
      .select('id,name')
      .order('name');


  if(error){

    console.warn(
      'Categories could not be loaded:',
      error
    );

    return;

  }


  if(!data){

    return;

  }


  data.forEach(category => {

    const option =
      document.createElement('option');

    option.value =
      category.id;

    option.textContent =
      category.name;

    categorySelect.appendChild(option);

  });

}


/* =========================
   LOAD JOBS
========================= */

async function loadJobs(){

  const status =
    document.getElementById('status');

  const box =
    document.getElementById('jobs');


  status.textContent =
    'Loading jobs...';

  box.innerHTML =
    '<div class="loading">Loading current opportunities...</div>';


  /*
   * IMPORTANT:
   * Use the public_active_jobs VIEW.
   *
   * Do NOT order by "featured".
   * The current view does not contain
   * a featured column.
   */

  let query =
    sb
      .from('public_active_jobs')
      .select('*')
      .order(
        'created_at',
        {
          ascending:false
        }
      );


  const county =
    document
      .getElementById('county')
      .value;


  const category =
    document
      .getElementById('category')
      .value;


  const type =
    document
      .getElementById('type')
      .value;


  const search =
    document
      .getElementById('q')
      .value
      .trim()
      .toLowerCase();


  /* COUNTY FILTER */

  if(county){

    query =
      query.ilike(
        'location',
        '%' + county + '%'
      );

  }


  /* CATEGORY FILTER */

  if(category){

    query =
      query.eq(
        'category_id',
        category
      );

  }


  /* JOB TYPE FILTER */

  if(type){

    query =
      query.ilike(
        'job_type',
        '%' + type + '%'
      );

  }


  const {
    data,
    error
  } =
    await query;


  /* DATABASE ERROR */

  if(error){

    console.error(
      'KaziNexus jobs error:',
      error
    );

    status.textContent =
      '';

    box.innerHTML =
      `
      <div class="error">

        <strong>
          Unable to load jobs right now.
        </strong>

        <p>
          Please refresh the page and try again.
        </p>

      </div>
      `;

    return;

  }


  /* SEARCH FILTER */

  const jobs =
    (data || []).filter(job => {

      if(!search){

        return true;

      }


      return [

        job.title,
        job.company,
        job.location,
        job.category_name,
        job.description,
        job.job_type

      ].some(value =>

        String(value || '')
          .toLowerCase()
          .includes(search)

      );

    });


  /* RESULT COUNT */

  status.textContent =
    jobs.length
      ? jobs.length +
        ' job' +
        (jobs.length === 1 ? '' : 's') +
        ' found'
      : 'No matching jobs found';


  /* NO RESULTS */

  if(!jobs.length){

    box.innerHTML =
      `
      <div class="empty">

        <strong>
          No jobs match your search.
        </strong>

        <p>
          Try different keywords or filters.
        </p>

      </div>
      `;

    return;

  }


  /* =========================
     DISPLAY JOB CARDS
  ========================= */

  box.innerHTML =
    jobs.map(job => {

      const id =
        encodeURIComponent(
          job.id
        );


      const title =
        esc(
          job.title ||
          'Untitled job'
        );


      const company =
        esc(
          job.company ||
          'Employer not specified'
        );


      const location =
        esc(
          job.location ||
          'Kenya'
        );


      const jobType =
        esc(
          val(
            job,
            'job_type',
            'jobtype',
            'jobType'
          ) ||
          'Job'
        );


      const salary =
        esc(
          job.salary || ''
        );


      const category =
        esc(
          job.category_name || ''
        );


      let deadline =
        'Not specified';


      if(job.deadline){

        const date =
          new Date(
            job.deadline
          );


        if(!Number.isNaN(date.getTime())){

          deadline =
            date.toLocaleDateString(
              'en-KE',
              {
                day:'numeric',
                month:'short',
                year:'numeric'
              }
            );

        }

      }


      const verifiedBadge =
        job.employer_verified
          ? `
            <span class="pill verified">
              ✓ Verified employer
            </span>
          `
          : '';


      return `

      <article class="card">

        <h2>
          ${title}
        </h2>


        <div class="company">

          <span>
            ${company}
          </span>

          ${verifiedBadge}

        </div>


        <div class="meta">

          <span class="pill">
            ${location}
          </span>


          <span class="pill">
            ${jobType}
          </span>


          ${
            category
              ? `
                <span class="pill">
                  ${category}
                </span>
              `
              : ''
          }


          ${
            salary
              ? `
                <span class="pill">
                  ${salary}
                </span>
              `
              : ''
          }


          <span class="pill">
            Deadline: ${esc(deadline)}
          </span>

        </div>


        <p class="excerpt">

          ${esc(
            excerpt(
              job.description
            )
          )}

        </p>


        <div class="actions">

          <a
            href="/jobs/detail.html?id=${id}"
          >
            View Job
          </a>

        </div>

      </article>

      `;

    }).join('');

}


/* =========================
   SEARCH BUTTON
========================= */

document
  .getElementById('searchBtn')
  .addEventListener(
    'click',
    loadJobs
  );


/* =========================
   ENTER KEY SEARCH
========================= */

document
  .getElementById('q')
  .addEventListener(
    'keydown',
    event => {

      if(event.key === 'Enter'){

        loadJobs();

      }

    }
  );


/* =========================
   AUTO-REFRESH WHEN FILTERS
   CHANGE
========================= */

document
  .getElementById('county')
  .addEventListener(
    'change',
    loadJobs
  );


document
  .getElementById('category')
  .addEventListener(
    'change',
    loadJobs
  );


document
  .getElementById('type')
  .addEventListener(
    'change',
    loadJobs
  );


/* =========================
   INITIAL LOAD
========================= */

(async function(){

  await loadCategories();

  await loadJobs();

})();

</script>

</body>
</html>
