<script>
  /*
   * KaziNexus Supabase configuration
   * Correct production project
   */

  const SUPABASE_URL =
    "https://vljehlfeglstpgphzebj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_QtYMFyv1din55Ch8bbznug_YCoF1XB3";

  const db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const params =
    new URLSearchParams(window.location.search);

  const jobId =
    params.get("id");

  const jobCard =
    document.getElementById("jobCard");


  function escapeHTML(value) {
    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function getValue(
    job,
    names,
    fallback = ""
  ) {

    for (const name of names) {

      if (
        Object.prototype.hasOwnProperty.call(
          job,
          name
        ) &&
        job[name] !== null &&
        job[name] !== undefined &&
        String(job[name]).trim() !== ""
      ) {
        return job[name];
      }

    }

    return fallback;
  }


  function formatDate(value) {

    if (!value) {
      return "Not specified";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return String(value);
    }

    return date.toLocaleDateString(
      "en-KE",
      {
        day: "numeric",
        month: "short",
        year: "numeric"
      }
    );
  }


  function formatSalary(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "Not specified";
    }

    if (
      typeof value === "number"
    ) {
      return (
        "KSh " +
        value.toLocaleString("en-KE")
      );
    }

    return String(value);
  }


  function createSection(
    title,
    value
  ) {

    if (
      !value ||
      String(value).trim() === ""
    ) {
      return null;
    }

    const section =
      document.createElement("section");

    const heading =
      document.createElement("h2");

    heading.textContent =
      title;

    const content =
      document.createElement("div");

    content.className =
      "description";

    content.textContent =
      value;

    section.appendChild(
      heading
    );

    section.appendChild(
      content
    );

    return section;
  }


  function renderJob(job) {

    jobCard.className = "card";
    jobCard.innerHTML = "";

    const title =
      getValue(
        job,
        ["title", "job_title"],
        "Job Opportunity"
      );

    const company =
      getValue(
        job,
        [
          "company",
          "organization_name",
          "organization",
          "employer_name"
        ],
        "KaziNexus"
      );

    const location =
      getValue(
        job,
        ["location", "job_location"],
        "Not specified"
      );

    const jobType =
      getValue(
        job,
        [
          "job_type",
          "jobtype",
          "jobType"
        ],
        "Not specified"
      );

    const salary =
      getValue(
        job,
        [
          "salary",
          "salary_range",
          "pay"
        ],
        ""
      );

    const category =
      getValue(
        job,
        [
          "category_name",
          "category"
        ],
        ""
      );

    const deadline =
      getValue(
        job,
        [
          "deadline",
          "application_deadline"
        ],
        ""
      );

    const description =
      getValue(
        job,
        [
          "description",
          "job_description"
        ],
        ""
      );

    const responsibilities =
      getValue(
        job,
        [
          "responsibilities",
          "responsibility"
        ],
        ""
      );

    const qualifications =
      getValue(
        job,
        [
          "qualifications",
          "qualification"
        ],
        ""
      );

    const contactPerson =
      getValue(
        job,
        [
          "contact_person",
          "contactPerson",
          "contact"
        ],
        ""
      );

    const email =
      getValue(
        job,
        [
          "application_email",
          "appl_email",
          "applicationEmail"
        ],
        ""
      );

    const applicationLink =
      getValue(
        job,
        [
          "application_link",
          "app_link",
          "applicationLink"
        ],
        ""
      );

    const featured =
      job.featured === true;


    document.title =
      title +
      " | KaziNexus";


    if (featured) {

      const badge =
        document.createElement("div");

      badge.className =
        "featured";

      badge.textContent =
        "FEATURED JOB";

      jobCard.appendChild(
        badge
      );
    }


    const h1 =
      document.createElement("h1");

    h1.textContent =
      title;

    jobCard.appendChild(
      h1
    );


    const companyDiv =
      document.createElement("div");

    companyDiv.className =
      "company";

    companyDiv.textContent =
      company;

    jobCard.appendChild(
      companyDiv
    );


    const meta =
      document.createElement("div");

    meta.className =
      "meta";


    function addMeta(
      label,
      value
    ) {

      const box =
        document.createElement("div");

      box.className =
        "meta-box";

      const labelElement =
        document.createElement("span");

      labelElement.className =
        "meta-label";

      labelElement.textContent =
        label;

      const valueElement =
        document.createElement("span");

      valueElement.className =
        "meta-value";

      valueElement.textContent =
        value;

      box.appendChild(
        labelElement
      );

      box.appendChild(
        valueElement
      );

      meta.appendChild(
        box
      );
    }


    addMeta(
      "Location",
      location
    );

    addMeta(
      "Job Type",
      jobType
    );

    addMeta(
      "Salary",
      formatSalary(salary)
    );

    addMeta(
      "Application Deadline",
      formatDate(deadline)
    );

    if (category) {

      addMeta(
        "Category",
        category
      );
    }

    jobCard.appendChild(
      meta
    );


    const descriptionSection =
      createSection(
        "Job Description",
        description
      );

    if (descriptionSection) {

      jobCard.appendChild(
        descriptionSection
      );
    }


    const responsibilitiesSection =
      createSection(
        "Responsibilities",
        responsibilities
      );

    if (responsibilitiesSection) {

      jobCard.appendChild(
        responsibilitiesSection
      );
    }


    const qualificationsSection =
      createSection(
        "Qualifications",
        qualifications
      );

    if (qualificationsSection) {

      jobCard.appendChild(
        qualificationsSection
      );
    }


    if (
      contactPerson ||
      email
    ) {

      const section =
        document.createElement("section");

      const heading =
        document.createElement("h2");

      heading.textContent =
        "Application Contact";

      section.appendChild(
        heading
      );


      const box =
        document.createElement("div");

      box.className =
        "contact-box";


      if (contactPerson) {

        const p =
          document.createElement("div");

        p.innerHTML =
          "<strong>Contact Person:</strong> " +
          escapeHTML(
            contactPerson
          );

        box.appendChild(
          p
        );
      }


      if (email) {

        const p =
          document.createElement("div");

        const emailLink =
          document.createElement("a");

        emailLink.href =
          "mailto:" + email;

        emailLink.textContent =
          email;

        p.appendChild(
          document.createTextNode(
            "Email: "
          )
        );

        p.appendChild(
          emailLink
        );

        box.appendChild(
          p
        );
      }


      section.appendChild(
        box
      );

      jobCard.appendChild(
        section
      );
    }


    const actions =
      document.createElement("div");

    actions.className =
      "actions";


    if (applicationLink) {

      const apply =
        document.createElement("a");

      apply.className =
        "btn apply";

      apply.textContent =
        "Apply Now";

      apply.href =
        applicationLink;

      apply.target =
        "_blank";

      apply.rel =
        "noopener noreferrer";

      actions.appendChild(
        apply
      );
    }


    if (email) {

      const emailButton =
        document.createElement("a");

      emailButton.className =
        "btn email";

      emailButton.textContent =
        "Apply by Email";

      emailButton.href =
        "mailto:" +
        email +
        "?subject=" +
        encodeURIComponent(
          "Application for " +
          title
        );

      actions.appendChild(
        emailButton
      );
    }


    const whatsapp =
      document.createElement("button");

    whatsapp.type =
      "button";

    whatsapp.className =
      "btn whatsapp";

    whatsapp.textContent =
      "Share on WhatsApp";

    whatsapp.addEventListener(
      "click",
      function () {

        const message =
          "Job Opportunity: " +
          title +
          "\nCompany: " +
          company +
          "\nLocation: " +
          location +
          "\n\nView this job on KaziNexus:\n" +
          window.location.href;

        const url =
          "https://wa.me/?text=" +
          encodeURIComponent(
            message
          );

        window.open(
          url,
          "_blank",
          "noopener,noreferrer"
        );
      }
    );

    actions.appendChild(
      whatsapp
    );


    const copy =
      document.createElement("button");

    copy.type =
      "button";

    copy.className =
      "btn copy";

    copy.textContent =
      "Copy Job Link";

    copy.addEventListener(
      "click",
      async function () {

        try {

          await navigator.clipboard.writeText(
            window.location.href
          );

          copy.textContent =
            "Link Copied ✓";

          setTimeout(
            function () {
              copy.textContent =
                "Copy Job Link";
            },
            2000
          );

        } catch (error) {

          prompt(
            "Copy this job link:",
            window.location.href
          );
        }
      }
    );

    actions.appendChild(
      copy
    );


    const back =
      document.createElement("a");

    back.className =
      "btn back-btn";

    back.textContent =
      "← Back to Jobs";

    back.href =
      "/jobs/";

    actions.appendChild(
      back
    );


    jobCard.appendChild(
      actions
    );
  }


  function showError(
    message
  ) {

    jobCard.className =
      "card error";

    jobCard.innerHTML = "";

    const heading =
      document.createElement("h2");

    heading.textContent =
      "Unable to load job";

    const paragraph =
      document.createElement("p");

    paragraph.textContent =
      message;

    jobCard.appendChild(
      heading
    );

    jobCard.appendChild(
      paragraph
    );

    const back =
      document.createElement("a");

    back.href =
      "/jobs/";

    back.className =
      "btn back-btn";

    back.textContent =
      "← Back to Jobs";

    jobCard.appendChild(
      back
    );
  }


  async function loadJob() {

    if (!jobId) {

      showError(
        "No job ID was provided."
      );

      return;
    }


    try {

      const result =
        await db
          .from("public_active_jobs")
          .select("*")
          .eq("id", jobId)
          .maybeSingle();


      if (result.error) {

        console.error(
          "KaziNexus Supabase error:",
          result.error
        );

        showError(
          "Unable to connect to the KaziNexus jobs database. Please refresh the page and try again."
        );

        return;
      }


      if (!result.data) {

        showError(
          "This job could not be found or is no longer active."
        );

        return;
      }


      renderJob(
        result.data
      );

    } catch (error) {

      console.error(
        "Unexpected error:",
        error
      );

      showError(
        "An unexpected error occurred while loading this job."
      );
    }
  }


  loadJob();
</script>

</body>
