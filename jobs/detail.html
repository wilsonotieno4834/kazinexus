<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KaziNexus Job</title>

<meta name="description" content="View this job opportunity on KaziNexus.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KaziNexus">
<meta property="og:title" content="KaziNexus Job">
<meta property="og:description" content="Connect Opportunities With the Right Talent.">
<meta name="robots" content="index,follow">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f6f8fb;
  color:#172033;
}

.head{
  background:#102a43;
  color:#fff;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.head a{
  color:#fff;
  text-decoration:none;
}

.wrap{
  max-width:900px;
  margin:30px auto;
  padding:0 18px;
}

.card{
  background:#fff;
  padding:28px;
  border-radius:16px;
  box-shadow:0 4px 18px #0001;
}

h1{
  margin:0 0 8px;
  font-size:30px;
  color:#172033;
}

.company{
  font-size:18px;
  font-weight:700;
  color:#126b48;
  margin-bottom:20px;
}

.meta{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin:20px 0;
}

.meta-box{
  background:#f6f8fb;
  padding:14px;
  border-radius:10px;
}

.meta-label{
  display:block;
  font-size:12px;
  color:#667085;
  margin-bottom:5px;
}

.meta-value{
  font-weight:700;
}

section{
  margin-top:28px;
}

section h2{
  font-size:20px;
  margin-bottom:10px;
  color:#172033;
}

.description{
  white-space:pre-line;
  line-height:1.7;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:28px;
}

.btn{
  display:inline-block;
  padding:12px 16px;
  border-radius:8px;
  border:0;
  text-decoration:none;
  font-weight:800;
  cursor:pointer;
  background:#126b48;
  color:#fff;
}

.wa{
  background:#25d366;
}

.copy{
  background:#eef2f6;
  color:#172033;
}

.email{
  background:#0b5ed7;
}

.error{
  color:#a12b2b;
  background:#fff0f0;
  padding:15px;
  border-radius:8px;
}

.loading{
  text-align:center;
  padding:40px 20px;
}

@media(max-width:600px){

  .card{
    padding:20px;
  }

  .head{
    padding:15px;
  }

  h1{
    font-size:24px;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    text-align:center;
  }
}
</style>
</head>

<body>

<header class="head">
  <strong>Kazi<span>Nexus</span></strong>
  <a href="/jobs/">Find Jobs</a>
</header>

<main class="wrap">

<article id="job" class="card loading">
  Loading job...
</article>

</main>

<script>

const db = supabase.createClient(
  'https://vljehlfeglstpgphzebd.supabase.co',
  'sb_publishable_JXl3v8y4m8bq6p2z9n7k5r3t1s0f'
);

const id = new URLSearchParams(location.search).get('id');

function showError(message){

  const job = document.getElementById('job');

  job.className = 'card error';

  job.innerHTML = '';

  const title = document.createElement('h2');
  title.textContent = 'Unable to load job';

  const text = document.createElement('p');
  text.textContent = message;

  job.appendChild(title);
  job.appendChild(text);
}

function getValue(job,names,fallback=''){

  for(const name of names){

    if(
      Object.prototype.hasOwnProperty.call(job,name) &&
      job[name] !== null &&
      job[name] !== undefined &&
      String(job[name]).trim() !== ''
    ){

      return job[name];
    }
  }

  return fallback;
}

function createSection(title,value){

  if(!value){
    return null;
  }

  const section = document.createElement('section');

  const heading = document.createElement('h2');
  heading.textContent = title;

  const content = document.createElement('div');
  content.className = 'description';
  content.textContent = value;

  section.appendChild(heading);
  section.appendChild(content);

  return section;
}

function renderJob(job){

  const container = document.getElementById('job');

  container.className = 'card';
  container.innerHTML = '';

  const title = getValue(
    job,
    ['title','job_title'],
    'Job Opportunity'
  );

  const company = getValue(
    job,
    [
      'company',
      'organization_name',
      'organization',
      'employer_name'
    ],
    'KaziNexus'
  );

  const location = getValue(
    job,
    ['location','job_location'],
    'Not specified'
  );

  const jobType = getValue(
    job,
    ['job_type','jobtype','jobType'],
    'Not specified'
  );

  const salary = getValue(
    job,
    ['salary','salary_range','pay'],
    'Not specified'
  );

  const deadline = getValue(
    job,
    ['deadline','application_deadline'],
    'Not specified'
  );

  const description = getValue(
    job,
    ['description','job_description'],
    'No job description provided.'
  );

  const responsibilities = getValue(
    job,
    ['responsibilities','respnsibilities'],
    ''
  );

  const qualifications = getValue(
    job,
    ['qualification','qualifications'],
    ''
  );

  const contact = getValue(
    job,
    ['contact_person','contactPerson','contact'],
    ''
  );

  const email = getValue(
    job,
    [
      'appl_email',
      'application_email',
      'applicationEmail'
    ],
    ''
  );

  const appLink = getValue(
    job,
    [
      'app_link',
      'application_link',
      'applicationLink'
    ],
    ''
  );

  document.title = title + ' - KaziNexus';

  const h1 = document.createElement('h1');
  h1.textContent = title;
  container.appendChild(h1);

  const companyDiv = document.createElement('div');
  companyDiv.className = 'company';
  companyDiv.textContent = company;
  container.appendChild(companyDiv);

  const meta = document.createElement('div');
  meta.className = 'meta';

  function addMeta(label,value){

    const box = document.createElement('div');
    box.className = 'meta-box';

    const labelEl = document.createElement('span');
    labelEl.className = 'meta-label';
    labelEl.textContent = label;

    const valueEl = document.createElement('span');
    valueEl.className = 'meta-value';
    valueEl.textContent = value;

    box.appendChild(labelEl);
    box.appendChild(valueEl);

    meta.appendChild(box);
  }

  addMeta('Location',location);
  addMeta('Job Type',jobType);
  addMeta('Salary',salary);
  addMeta('Deadline',deadline);

  container.appendChild(meta);

  const descriptionSection =
    createSection(
      'Job Description',
      description
    );

  if(descriptionSection){
    container.appendChild(descriptionSection);
  }

  const responsibilitySection =
    createSection(
      'Responsibilities',
      responsibilities
    );

  if(responsibilitySection){
    container.appendChild(responsibilitySection);
  }

  const qualificationSection =
    createSection(
      'Qualifications',
      qualifications
    );

  if(qualificationSection){
    container.appendChild(qualificationSection);
  }

  if(contact || email){

    const contactSection =
      document.createElement('section');

    const contactHeading =
      document.createElement('h2');

    contactHeading.textContent = 'Contact';

    contactSection.appendChild(contactHeading);

    const contactContent =
      document.createElement('div');

    contactContent.className = 'description';

    if(contact){

      const contactLine =
        document.createElement('div');

      contactLine.textContent =
        'Contact Person: ' + contact;

      contactContent.appendChild(contactLine);
    }

    if(email){

      const emailLine =
        document.createElement('div');

      emailLine.textContent =
        'Email: ' + email;

      contactContent.appendChild(emailLine);
    }

    contactSection.appendChild(contactContent);

    container.appendChild(contactSection);
  }

  if(email || appLink){

    const applySection =
      document.createElement('section');

    const applyHeading =
      document.createElement('h2');

    applyHeading.textContent = 'How to Apply';

    applySection.appendChild(applyHeading);

    const applyText =
      document.createElement('div');

    applyText.className = 'description';

    if(email){

      applyText.textContent =
        'Applications can be sent to: ' + email;
    }

    if(appLink){

      if(email){
        applyText.textContent +=
          '\nUse the Apply Now button below to open the application page.';
      }else{
        applyText.textContent =
          'Use the Apply Now button below to apply.';
      }
    }

    applySection.appendChild(applyText);

    container.appendChild(applySection);
  }

  const actions =
    document.createElement('div');

  actions.className = 'actions';

  if(appLink){

    const apply =
      document.createElement('a');

    apply.className = 'btn';
    apply.textContent = 'Apply Now';
    apply.href = appLink;
    apply.target = '_blank';
    apply.rel = 'noopener';

    actions.appendChild(apply);
  }

  if(email){

    const emailButton =
      document.createElement('a');

    emailButton.className =
      'btn email';

    emailButton.textContent =
      'Apply by Email';

    emailButton.href =
      'mailto:' +
      email +
      '?subject=' +
      encodeURIComponent(
        'Application for ' + title
      );

    actions.appendChild(emailButton);
  }

  const whatsapp =
    document.createElement('button');

  whatsapp.className =
    'btn wa';

  whatsapp.textContent =
    'Share on WhatsApp';

  whatsapp.onclick =
    function(){

      const message =
        'Job Opportunity: ' +
        title +
        '\nCompany: ' +
        company +
        '\n\nView and apply here:\n' +
        window.location.href;

      const url =
        'https://wa.me/?text=' +
        encodeURIComponent(message);

      window.open(
        url,
        '_blank',
        'noopener'
      );
    };

  actions.appendChild(whatsapp);

  const copy =
    document.createElement('button');

  copy.className =
    'btn copy';

  copy.textContent =
    'Copy Job Link';

  copy.onclick =
    async function(){

      const url =
        window.location.href;

      try{

        await navigator.clipboard.writeText(url);

        alert('Job link copied.');

      }catch(error){

        prompt(
          'Copy this job link:',
          url
        );
      }
    };

  actions.appendChild(copy);

  container.appendChild(actions);
}

async function loadJob(){

  if(!id){

    showError(
      'No job ID was provided.'
    );

    return;
  }

  try{

    const result =
      await db
        .from('public_active_jobs')
        .select('*')
        .eq('id',id)
        .maybeSingle();

    const data = result.data;
    const error = result.error;

    if(error){

      console.error(
        'Supabase error:',
        error
      );

      showError(
        'Unable to load this job: ' +
        error.message
      );

      return;
    }

    if(!data){

      showError(
        'Job not found or the job is no longer active.'
      );

      return;
    }

    renderJob(data);

  }catch(error){

    console.error(
      'Unexpected error:',
      error
    );

    showError(
      'An unexpected error occurred while loading this job.'
    );
  }
}

loadJob();

</script>

</body>
</html>
