  <style>

<body>
  <header class="header">
    <a class="logo" href="/">Kazi<span>Nexus</span></a>
    <a class="back" href="/">Back to KaziNexus</a>
  </header>

  <main class="wrap">
    <section class="card">
      <h1 id="heading">Create Employer Account</h1>
      <p class="intro">
        Create a free employer account to post vacancies and manage
        applications on KaziNexus.
      </p>

      <div class="tabs">
        <button id="signupTab" class="active" type="button">Sign Up</button>
        <button id="loginTab" type="button">Login</button>
      </div>

      <form id="authForm">
        <div id="signupFields">
          <div class="field">
            <label for="organization">Company / Organization *</label>
            <input
              id="organization"
              type="text"
              autocomplete="organization"
              placeholder="e.g. ABC Kenya Ltd"
              required
            >
          </div>

          <div class="field">
            <label for="contact">Contact Person *</label>
            <input
              id="contact"
              type="text"
              autocomplete="name"
              placeholder="Full name"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="email">Email Address *</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@company.com"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password *</label>
          <input
            id="password"
            type="password"
            minlength="6"
            autocomplete="current-password"
            placeholder="At least 6 characters"
            required
          >
        </div>

        <button class="submit" id="submitBtn" type="submit">
          Create Employer Account
        </button>
      </form>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <p class="note">
        Basic job posting remains free for employers. Use the same email
        address and password when logging in again.
      </p>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL =
        "https://vljehlfeglstpgphzebj.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_QtYMFyv1din55Ch8bbznug_YCoF1XB3";

      const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      const $ = (id) => document.getElementById(id);

      const form = $("authForm");
      const submitBtn = $("submitBtn");
      const message = $("message");

      let mode = "signup";

      // Only allow local site paths as return destinations.
      function getDestination() {
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next");

        if (
          next &&
          next.startsWith("/") &&
          !next.startsWith("//") &&
          !next.includes("\\")
        ) {
          return next;
        }

        return "/dashboard-connected.html";
      }

      function redirectAfterLogin() {
        window.location.assign(getDestination());
      }

      function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
      }

      function clearMessage() {
        message.textContent = "";
        message.className = "message";
      }

      function setMode(newMode) {
        mode = newMode;

        const isSignup = mode === "signup";

        $("signupFields").classList.toggle("hidden", !isSignup);
        $("organization").required = isSignup;
        $("contact").required = isSignup;

        $("heading").textContent = isSignup
          ? "Create Employer Account"
          : "Employer Login";

        submitBtn.textContent = isSignup
          ? "Create Employer Account"
          : "Login";

        $("signupTab").classList.toggle("active", isSignup);
        $("loginTab").classList.toggle("active", !isSignup);

        $("password").autocomplete = isSignup
          ? "new-password"
          : "current-password";

        clearMessage();
      }

      $("signupTab").addEventListener("click", () => setMode("signup"));
      $("loginTab").addEventListener("click", () => setMode("login"));

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearMessage();

        submitBtn.disabled = true;
        submitBtn.textContent = "Please wait...";

        try {
          const email = $("email").value.trim();
          const password = $("password").value;

          if (mode === "signup") {
            const organization = $("organization").value.trim();
            const contact = $("contact").value.trim();

            const { data, error } = await db.auth.signUp({
              email,
              password,
              options: {
                data: {
                  role: "employer",
                  organization_name: organization,
                  contact_person: contact,
                  full_name: contact
                }
              }
            });

            if (error) throw error;

            if (data.session) {
              showMessage("Account created. Opening your dashboard...", "success");
              redirectAfterLogin();
              return;
            }

            showMessage(
              "Your registration was submitted. If email confirmation is enabled, open the confirmation message sent to your email, then return here and log in.",
              "success"
            );

            setMode("login");
            $("email").value = email;
            $("password").value = "";
          } else {
            const { data, error } = await db.auth.signInWithPassword({
              email,
              password
            });

            if (error) throw error;

            if (!data.session) {
              throw new Error(
                "Login did not create a session. Please try again."
              );
            }

            showMessage("Login successful. Opening your account...", "success");
            redirectAfterLogin();
            return;
          }
        } catch (error) {
          console.error("KaziNexus employer authentication error:", error);

          showMessage(
            error.message || "Something went wrong. Please try again.",
            "error"
          );
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = mode === "signup"
            ? "Create Employer Account"
            : "Login";
        }
      });

      // If already signed in, continue to the requested page.
      (async () => {
        try {
          const { data, error } = await db.auth.getSession();

          if (error) {
            console.error("Could not check existing session:", error);
            return;
          }

          if (data.session) {
            redirectAfterLogin();
          }
        } catch (error) {
          console.error("Session check failed:", error);
        }
      })();
    })();
  </script>
</body>
</html>
