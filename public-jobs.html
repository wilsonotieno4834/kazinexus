<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Jobs in Kenya | KaziNexus</title><meta name="description" content="Find current jobs and opportunities across Kenya by keyword, county, category and job type."><meta name="robots" content="index,follow"><link rel="canonical" href="https://kazinexus.pages.dev/jobs/"><style>body{font-family:Arial,sans-serif;margin:0;background:#f7f9fc;color:#172033}header{background:#102a43;color:#fff;padding:22px}main{max-width:1100px;margin:auto;padding:22px}.search{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;background:#fff;padding:16px;border-radius:12px}input,select,button{padding:12px;border:1px solid #ccd5df;border-radius:8px}button{cursor:pointer;background:#0b6e4f;color:white;border:0}.job{background:#fff;margin:14px 0;padding:18px;border-radius:12px;box-shadow:0 2px 8px #0000000d}.meta{color:#5d6b7a;font-size:14px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e7f6ef;color:#12633f;font-size:12px}@media(max-width:750px){.search{grid-template-columns:1fr}.job{padding:15px}}</style></head><body><header><strong>KaziNexus</strong><div>Connect Opportunities With the Right Talent</div></header><main><h1>Find Jobs in Kenya</h1><div class="search"><input id="q" placeholder="Job title, skill or company"><select id="county"><option value="">All counties</option></select><select id="category"><option value="">All categories</option></select><select id="type"><option value="">All job types</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option><option>Temporary</option><option>Volunteer</option><option>Remote</option></select><button onclick="loadJobs()">Search</button></div><p id="count"></p><section id="jobs">Loading jobs…</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://vljehlfeglstpgphzebj.supabase.co',KEY='sb_publishable_QtYMFyv1din55Ch8bbznug_YCoF1XB3',db=supabase.createClient(URL,KEY);const counties=['Baringo','Bomet','Bungoma','Busia','Elgeyo-Marakwet','Embu','Garissa','Homa Bay','Isiolo','Kajiado','Kakamega','Kericho','Kiambu','Kilifi','Kirinyaga','Kisii','Kisumu','Kitui','Kwale','Laikipia','Lamu','Machakos','Makueni','Mandera','Marsabit','Meru','Migori','Mombasa','Murang’a','Nairobi','Nakuru','Nandi','Narok','Nyamira','Nyandarua','Nyeri','Samburu','Siaya','Taita-Taveta','Tana River','Tharaka-Nithi','Trans Nzoia','Turkana','Uasin Gishu','Vihiga','Wajir','West Pokot'];const countyEl=document.getElementById('county');counties.forEach(x=>countyEl.insertAdjacentHTML('beforeend',`<option>${x}</option>`));async function init(){const {data}=await db.from('categories').select('id,name').order('name');(data||[]).forEach(c=>document.getElementById('category').insertAdjacentHTML('beforeend',`<option value="${c.id}">${c.name}</option>`));loadJobs()}async function loadJobs(){const q=document.getElementById('q').value.trim().toLowerCase(),county=document.getElementById('county').value,type=document.getElementById('type').value,cat=document.getElementById('category').value;let query=db.from('public_active_jobs').select('*').order('featured',{ascending:false}).order('created_at',{ascending:false});if(county)query=query.ilike('location',`%${county}%`);if(type)query=query.eq('job_type',type);if(cat)query=query.eq('category_id',cat);const {data,error}=await query;if(error){document.getElementById('jobs').textContent=error.message;return}const filtered=(data||[]).filter(j=>!q||[j.title,j.company,j.location,j.description,j.category_name].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=`${filtered.length} job${filtered.length===1?'':'s'} found`;document.getElementById('jobs').innerHTML=filtered.map(j=>`<article class="job"><h2>${esc(j.title)}</h2><div class="meta"><strong>${esc(j.company)}</strong> · ${esc(j.location)} · ${esc(j.job_type)}</div><p>${j.employer_verified?'<span class="badge">Verified Employer</span> ':''}${j.salary?esc(j.salary):''}</p><p>${esc((j.description||'').slice(0,260))}${(j.description||'').length>260?'…':''}</p><p><strong>Deadline:</strong> ${esc(j.deadline)}</p><button onclick="location.href='/apply?job=${encodeURIComponent(j.id)}'">Apply</button></article>`).join('')||'<p>No matching jobs found.</p>'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}init();</script></body></html>
