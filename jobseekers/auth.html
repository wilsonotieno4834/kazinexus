
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in or register as a job seeker on KaziNexus Kenya.">
  <title>Job Seeker Login | KaziNexus</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fb;
      color: #172033;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #073b70;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header a { color: white; text-decoration: none; }

    .brand { font-size: 23px; font-weight: 800; }

    .container {
      width: 100%;
      max-width: 460px;
      margin: 42px auto;
      padding: 0 16px;
      flex: 1;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 15px;
      box-shadow: 0 8px 28px rgba(0,0,0,.08);
    }

    h1 { margin: 0 0 8px; font-size: 27px; }
    .intro { color: #64748b; line-height: 1.5; margin-bottom: 24px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 22px; }

    .tabs button {
      flex: 1;
      border: 1px solid #d7dfeb;
      background: #f5f7fb;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .tabs button.active {
      background: #073b70;
      color: white;
      border-color: #073b70;
    }

    label { display: block; font-weight: 700; margin: 15px 0 7px; }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    .submit {
      width: 100%;
      border: 0;
      padding: 14px;
      margin-top: 22px;
      border-radius: 8px;
      background: #087443;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit:disabled { opacity: .6; cursor: wait; }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.success { display: block; background: #dcfce7; color: #166534; }
    #message.error { display: block; background: #fee2e2; color: #991b1b; }
    #message.info { display: block; background: #dbeafe; color: #1e40af; }

    .small { text-align: center; color: #64748b; font-size: 14px; line-height: 1.6; }
    .small a { color: #0755a5; }

    footer { text-align: center; padding: 20px; color: #64748b; font-size: 13px; }

    @media (max-width: 480px) {
      .container { margin: 24px auto; }
      .card { padding: 22px; }
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="../index.html">KaziNexus</a>
    <a href="../public-jobs.html">Find Jobs</a>
  </header>

  <main class="container">
    <section class="card">
      <h1 id="heading">Job Seeker Login</h1>
      <p class="intro" id="intro">Sign in to manage your profile, CV and job applications.</p>

      <div class="tabs">
        <button type="button" id="loginTab" class="active">Sign In</button>
        <button type="button" id="registerTab">Create Account</button>
      </div>

      <form id="authForm">
        <div id="nameField" hidden>
          <label for="fullName">Full Name</label>
          <input id="fullName" name="fullName" type="text"
                 autocomplete="name" maxlength="120">
        </div>

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email"
               autocomplete="email" required maxlength="254">

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required minlength="6">

        <button class="submit" id="submitButton" type="submit">Sign In</button>
      </form>

      <div id="message" role="status" aria-live="polite"></div>

      <p class="small">
        By using KaziNexus, you agree to use the platform honestly.
        <br>
        <a href="../index.html">Back to homepage</a>
      </p>
    </section>
  </main>

  <footer>
    KaziNexus Kenya · Connect Opportunities With the Right Talent.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      "use strict";

      const SUPABASE_URL = "https://vljehlfeglstpgphzebj.supabase.co";
      const SUPABASE_KEY = "sb_publishable_QtYMFyv1din55Ch8bbznug_YCoF1XB3";
      const DASHBOARD_URL = "../kazinexus_job_seeker_dashboard.html";

      const form = document.getElementById("authForm");
      const nameField = document.getElementById("nameField");
      const fullName = document.getElementById("fullName");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const submitButton = document.getElementById("submitButton");
      const message = document.getElementById("message");
      const loginTab = document.getElementById("loginTab");
      const registerTab = document.getElementById("registerTab");
      const heading = document.getElementById("heading");
      const intro = document.getElementById("intro");

      let mode = "login";
      let client = null;

      function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
      }

      function setMode(nextMode) {
        mode = nextMode;
        const registering = mode === "register";

        loginTab.classList.toggle("active", !registering);
        registerTab.classList.toggle("active", registering);
        nameField.hidden = !registering;
        fullName.required = registering;
        password.autocomplete = registering ? "new-password" : "current-password";
        heading.textContent = registering ? "Create Job Seeker Account" : "Job Seeker Login";
        intro.textContent = registering
          ? "Create your account to start managing your job search."
          : "Sign in to manage your profile, CV and job applications.";
        submitButton.textContent = registering ? "Create Account" : "Sign In";
        message.className = "";
        message.textContent = "";
      }

      loginTab.addEventListener("click", () => setMode("login"));
      registerTab.addEventListener("click", () => setMode("register"));

      if (!window.supabase || !window.supabase.createClient) {
        showMessage("The login service could not load. Check your internet connection and reload this page.", "error");
        submitButton.disabled = true;
        return;
      }

      try {
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      } catch (error) {
        showMessage("Unable to initialize the login service. Please try again later.", "error");
        submitButton.disabled = true;
        return;
      }

      async function redirectIfSignedIn() {
        try {
          const result = await client.auth.getSession();
          if (result.data && result.data.session) {
            window.location.replace(DASHBOARD_URL);
          }
        } catch (error) {
          console.error("Session check failed:", error);
        }
      }

      redirectIfSignedIn();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!client) {
          showMessage("Login service is unavailable. Please reload the page.", "error");
          return;
        }

        const userEmail = email.value.trim().toLowerCase();
        const userPassword = password.value;
        const name = fullName.value.trim();

        if (!userEmail || !userPassword) {
          showMessage("Enter your email address and password.", "error");
          return;
        }

        if (mode === "register" && !name) {
          showMessage("Please enter your full name.", "error");
          fullName.focus();
          return;
        }

        if (mode === "register" && userPassword.length < 6) {
          showMessage("Your password must contain at least 6 characters.", "error");
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = mode === "register" ? "Creating account..." : "Signing in...";

        try {
          if (mode === "register") {
            const result = await client.auth.signUp({
              email: userEmail,
              password: userPassword,
              options: {
                data: {
                  full_name: name,
                  user_type: "job_seeker"
                },
                emailRedirectTo: window.location.origin + DASHBOARD_URL
              }
            });

            if (result.error) throw result.error;

            if (result.data && result.data.session) {
              showMessage("Account created successfully. Opening your dashboard...", "success");
              window.location.replace(DASHBOARD_URL);
              return;
            }

            showMessage(
              "Your registration request was received. If email confirmation is enabled, check your inbox and confirm your email before signing in. If confirmation is disabled, try signing in.",
              "success"
            );
            setMode("login");
          } else {
            const result = await client.auth.signInWithPassword({
              email: userEmail,
              password: userPassword
            });

            if (result.error) throw result.error;

            showMessage("Login successful. Opening your dashboard...", "success");
            window.location.replace(DASHBOARD_URL);
            return;
          }
        } catch (error) {
          console.error("Authentication error:", error);

          let errorText = error && error.message
            ? error.message
            : "Something went wrong. Please try again.";

          if (/invalid login credentials/i.test(errorText)) {
            errorText = "Incorrect email or password. Check your details or create an account.";
          } else if (/email not confirmed/i.test(errorText)) {
            errorText = "Please confirm your email using the link sent to your inbox before signing in.";
          } else if (/user already registered/i.test(errorText)) {
            errorText = "An account with this email already exists. Please sign in instead.";
          } else if (/failed to fetch|network/i.test(errorText)) {
            errorText = "Could not connect to the login service. Check your internet connection and try again.";
          }

          showMessage(errorText, "error");
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = mode === "register" ? "Create Account" : "Sign In";
        }
      });
    })();
  </script>
</body>
</html>
